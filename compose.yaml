name: codex-sessions-viewer

services:
  api:
    build:
      context: ./backend
      target: runtime
    init: true
    environment:
      VIEWER_DATABASE: /data/viewer.sqlite3
      VIEWER_SOURCES_FILE: /config/sources.toml
      VIEWER_SESSION_METADATA_FILE: /config/session_metadata.json
      VIEWER_BOOKMARKS_DIRECTORY: /bookmarks
      VIEWER_ARCHIVES_DIRECTORY: /archives
    volumes:
      - type: bind
        source: ${VIEWER_SOURCES_ROOT:-..}
        target: /sources
        read_only: true
      - type: bind
        source: ./config
        target: /config
        read_only: true
      - type: volume
        source: viewer-data
        target: /data
      - type: bind
        source: ./bookmarks
        target: /bookmarks
      - type: bind
        source: ${VIEWER_ARCHIVES_ROOT:-./archives}
        target: /archives
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8080}:80"
    restart: unless-stopped

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test

  frontend-check:
    profiles: [test]
    build:
      context: ./frontend

volumes:
  viewer-data:
