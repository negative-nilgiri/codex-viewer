name: codex-sessions-viewer

services:
  api:
    build:
      context: ./backend
      target: runtime
    init: true
    environment:
      VIEWER_DATABASE: /data/viewer.sqlite3
      VIEWER_SESSIONS_ROOT: /sessions
    volumes:
      - type: bind
        source: ${CODEX_1_SESSIONS_DIR:-../codex_1/sessions}
        target: /sessions/codex_1
        read_only: true
      - type: bind
        source: ${CODEX_2_SESSIONS_DIR:-../codex_2/sessions}
        target: /sessions/codex_2
        read_only: true
      - type: volume
        source: viewer-data
        target: /data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8080}:80"
    restart: unless-stopped

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test

  frontend-check:
    profiles: [test]
    build:
      context: ./frontend

volumes:
  viewer-data:
