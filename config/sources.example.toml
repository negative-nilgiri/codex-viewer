# Copy this file to config/sources.toml, then adapt it to your machine.
#
# Docker mounts the host directory selected by VIEWER_SOURCES_ROOT at /sources.
# Every path below is therefore a CONTAINER path beneath /sources, not a host
# path. When tracking a single Codex sessions directory, use:
#
#   .env:
#     VIEWER_SOURCES_ROOT=/Users/alice/.codex/sessions
#
#   source path:
#     /sources
#
# Both paths then refer to the same directory.

[[sources]]
# `id` is an arbitrary label displayed by the viewer. It is not a Codex account
# name. Pick a short descriptive label and keep it stable because SQLite and
# browser settings use it as part of a session's identity.
id = "personal"

# Supported values are "codex" and "claude". The adapter describes the JSONL
# format; it does not affect where files are discovered.
adapter = "codex"

# Discovery is recursive. For Codex, point this at the directory containing the
# year/month/day session folders. Because the single-source example mounts that
# exact directory, its container path is simply /sources.
path = "/sources"

# Add more [[sources]] blocks only when the single source above is insufficient.
# All paths must be reachable beneath the same VIEWER_SOURCES_ROOT mount. For
# example, you could mount /Users/alice/agent-data and arrange these host paths:
#
#   /Users/alice/agent-data/personal/sessions
#   /Users/alice/agent-data/work/sessions
#   /Users/alice/agent-data/claude-projects
#
# Example second Codex home:
#
# [[sources]]
# id = "work"
# adapter = "codex"
# path = "/sources/work/sessions"
#
# Example Claude Code projects directory:
#
# [[sources]]
# id = "claude"
# adapter = "claude"
# path = "/sources/claude-projects"
