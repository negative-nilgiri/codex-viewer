# Copy this file to config/sources.toml, then adapt it to your machine.
#
# Every path is a host path: either absolute, or relative to this config/
# directory. `~` and `$HOME` are not expanded.

[[sources]]
# `id` is an arbitrary label displayed by the viewer. It is not a Codex account
# name. Pick a short descriptive label and keep it stable because SQLite and
# browser settings use it as part of a session's identity.
id = "personal"

# Supported values are "codex", "claude", and "archive". The adapter describes the JSONL
# format; it does not affect where files are discovered.
adapter = "codex"

# Discovery is recursive. For Codex, point this at the directory containing the
# year/month/day session folders.
path = "/Users/alice/.codex/sessions"

# Add more [[sources]] blocks for other session directories.
#
# Example second Codex home:
#
# [[sources]]
# id = "work"
# adapter = "codex"
# path = "/Users/alice/.codex-work/sessions"
#
# Example Claude Code projects directory:
#
# [[sources]]
# id = "claude"
# adapter = "claude"
# path = "/Users/alice/.claude/projects"

# Archives created by this viewer. Keep this entry enabled to rediscover an
# exported conversation as an ordinary session. It must be the directory set by
# VIEWER_ARCHIVES_ROOT in .env (default ./archives, which is ../archives from here).
[[sources]]
id = "archive"
adapter = "archive"
path = "../archives"
